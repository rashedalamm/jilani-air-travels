{% extends 'base.html' %}{% block title %}{{ 'Edit' if package else 'Add' }} Package | JILANI AIR TRAVELS{% endblock %}{% block content %}<section class="form-page"><div class="container"><div class="editor-card"><a class="text-link" href="{{ url_for('admin_dashboard') }}">← Back to dashboard</a><h1>{{ 'Edit' if package else 'Add New' }} <em>Package</em></h1><form method="post" class="editor-form"><div class="form-row"><label>Package name *<input name="title" required value="{{ package.title if package else '' }}"></label><label>Category<select name="category">{% for c in ['Umrah','Hajj','Air Ticket','Visa Service','Other'] %}<option value="{{ c }}" {% if package and package.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label></div><div class="form-row"><label>Price / price note *<input name="price" required placeholder="Contact for price" value="{{ package.price if package else '' }}"></label><label>Duration<input name="duration" placeholder="14 Days" value="{{ package.duration if package else '' }}"></label></div><div class="form-row"><label>Departure dates<input name="departure" value="{{ package.departure if package else '' }}"></label><label>Airline<input name="airline" value="{{ package.airline if package else '' }}"></label></div><label>Hotel information<input name="hotel" value="{{ package.hotel if package else '' }}"></label><label>Details<textarea name="details" rows="4">{{ package.details if package else '' }}</textarea></label><label>Image URL<input name="image_url" type="url" placeholder="https://..." value="{{ package.image_url if package else '' }}"></label><label class="check-label"><input type="checkbox" name="featured" {% if package and package.featured %}checked{% endif %}> Mark as popular package</label><button class="btn btn-gold" type="submit">Save Package ↗</button></form></div></div></section>{% endblock %}
